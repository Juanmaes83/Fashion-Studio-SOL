name: Phase 2 Foundation

on:
  push:
    branches: ["phase-2/**"]
  pull_request:
    branches: ["main"]

jobs:
  postgres-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fashion
          POSTGRES_PASSWORD: fashion
          POSTGRES_DB: fashion_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fashion -d fashion_studio"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: fashion
      PGPASSWORD: fashion
      PGDATABASE: fashion_studio
      DATABASE_URL: postgresql://fashion:fashion@localhost:5432/fashion_studio
      ADMIN_API_TOKEN: phase2-test-token
      API_BASE_URL: http://127.0.0.1:8787
      ALLOWED_ORIGINS: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify one canonical foundation migration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find database/migrations -maxdepth 1 -type f -name '*phase2_foundation.sql' | sort)
          test "${#migrations[@]}" -eq 1
          test "${migrations[0]}" = "database/migrations/0001_phase2_foundation.sql"

      - name: Apply migration on clean PostgreSQL 16
        run: psql --set ON_ERROR_STOP=on --file database/migrations/0001_phase2_foundation.sql

      - name: Run foundation integrity smoke tests
        run: psql --set ON_ERROR_STOP=on --file database/tests/phase2_foundation_smoke.sql

      - name: Verify expected tables and indexes
        shell: bash
        run: |
          set -euo pipefail
          tables=$(psql -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('workspaces','brands','projects','collections','garments','outfits','outfit_items','assets','reviews','state_transitions','generation_jobs','job_attempts','publications','saved_looks');")
          test "$tables" -eq 14
          indexes=$(psql -Atc "select count(*) from pg_indexes where schemaname='public' and indexname in ('publications_one_active_per_project','jobs_claim_idx','assets_project_visibility_idx');")
          test "$indexes" -eq 3

      - name: Install API runtime dependency
        run: npm install --no-package-lock --ignore-scripts

      - name: Start shared API
        shell: bash
        run: |
          set -euo pipefail
          npm run api:start > /tmp/platform-api.log 2>&1 &
          echo $! > /tmp/platform-api.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/platform-api.log
          exit 1

      - name: Run Phase 2B HTTP end-to-end
        shell: bash
        run: |
          set +e
          npm run api:smoke > /tmp/phase2b-smoke.log 2>&1
          code=$?
          cat /tmp/phase2b-smoke.log
          exit $code

      - name: Collect API diagnostics
        if: always()
        run: |
          cp /tmp/platform-api.log ./platform-api.log || true
          cp /tmp/phase2b-smoke.log ./phase2b-smoke.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2b-api-diagnostics
          path: |
            platform-api.log
            phase2b-smoke.log
          retention-days: 3

      - name: Stop shared API
        if: always()
        run: test ! -f /tmp/platform-api.pid || kill $(cat /tmp/platform-api.pid) || true
