name: Phase 2 Foundation

on:
  push:
    branches: ["phase-2/**"]
  pull_request:
    branches: ["main"]

jobs:
  postgres-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fashion
          POSTGRES_PASSWORD: fashion
          POSTGRES_DB: fashion_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fashion -d fashion_studio"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: fashion
      PGPASSWORD: fashion
      PGDATABASE: fashion_studio

    steps:
      - uses: actions/checkout@v4

      - name: Verify one canonical foundation migration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find database/migrations -maxdepth 1 -type f -name '*phase2_foundation.sql' | sort)
          printf '%s\n' "${migrations[@]}"
          test "${#migrations[@]}" -eq 1
          test "${migrations[0]}" = "database/migrations/0001_phase2_foundation.sql"

      - name: Apply migration on clean PostgreSQL 16
        run: psql --set ON_ERROR_STOP=on --file database/migrations/0001_phase2_foundation.sql

      - name: Run integrity smoke tests
        run: psql --set ON_ERROR_STOP=on --file database/tests/phase2_foundation_smoke.sql

      - name: Verify expected tables and indexes
        shell: bash
        run: |
          set -euo pipefail
          tables=$(psql -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('workspaces','brands','projects','collections','garments','outfits','outfit_items','assets','reviews','state_transitions','generation_jobs','job_attempts','publications','saved_looks');")
          test "$tables" -eq 14
          psql -Atc "select indexname from pg_indexes where schemaname='public' and indexname in ('publications_one_active_per_project','jobs_claim_idx','assets_project_visibility_idx');" | sort

      - name: Reapply must fail rather than silently fork schema
        shell: bash
        run: |
          set -euo pipefail
          if psql --set ON_ERROR_STOP=on --file database/migrations/0001_phase2_foundation.sql >/tmp/reapply.log 2>&1; then
            echo "Migration unexpectedly reapplied without a migration ledger"
            cat /tmp/reapply.log
            exit 1
          fi
          grep -Eq 'already exists|duplicate' /tmp/reapply.log
          echo "Reapply protection: PASS"
